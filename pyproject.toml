[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ambipom"
version = "1.0.0"
description = "AMBIPOM: a human-LLM collaborative planning system and dataset for orchestrated multi-agent systems."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.116.2",
    "uvicorn==0.35.0",
    "openai==1.108.1",
    "networkx==3.4.2",
    "pydantic==2.11.9",
    "sympy==1.14.0",
    # numpy/scipy: not imported by the library; LLM-generated `code`-agent scripts use them
    "numpy>=1.26",
    "scipy>=1.11",
    "typing-extensions>=4.0",
    "fireworks-ai==0.19.19",
    "requests==2.32.5",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
experiment = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
